<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GDTP Case View Chat</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1c2230; --muted:#6b7280; --accent:#1f4fd8; --user:#e8efff; --line:#dfe3ea;
          --ok:#146c2e; --okbg:#e3f4e8; --bad:#b42318; --badbg:#fde8e6; --warn:#8a5a00; --warnbg:#fff3d6; --unk:#5b3fa0; --unkbg:#ece6fa; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171d; --card:#1c2029; --ink:#e8ebf1; --muted:#98a1b3; --accent:#6d93ff; --user:#24304f; --line:#2b3140;
          --ok:#6fd58c; --okbg:#173323; --bad:#ff8f84; --badbg:#3a1b19; --warn:#f2c35b; --warnbg:#3a2e12; --unk:#b9a3f0; --unkbg:#2a2342; } }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui,sans-serif; display:flex; flex-direction:column; height:100dvh; overflow:hidden; }
  header { flex:0 0 auto; padding:10px 16px; background:var(--card); border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; flex:1; }
  select, button, input { font:inherit; color:inherit; }
  select { padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--card); }
  #chatwrap { position:relative; flex:1 1 auto; min-height:0; }
  #chat { height:100%; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; max-width:1000px; width:100%; margin:0 auto; }
  #jump { position:absolute; left:50%; bottom:12px; transform:translateX(-50%); background:var(--accent); color:#fff; border:0; border-radius:16px; padding:6px 14px; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.25); }
  #jump[hidden] { display:none; }
  .msg { flex:0 0 auto; padding:10px 14px; border-radius:10px; max-width:85%; background:var(--card); border:1px solid var(--line); overflow-x:auto; }
  .msg.bot.wide { max-width:100%; width:100%; }
  .msg.user { align-self:flex-end; background:var(--user); white-space:pre-wrap; }
  .msg.err { color:var(--bad); }
  .md > :first-child { margin-top:0; } .md > :last-child { margin-bottom:0; }
  .md h1, .md h2, .md h3 { font-size:15px; margin:14px 0 6px; }
  .md p, .md ul, .md ol { margin:6px 0; }
  .md table { border-collapse:collapse; margin:8px 0; font-size:13px; }
  .md th, .md td { border:1px solid var(--line); padding:4px 8px; text-align:left; vertical-align:top; }
  .md code { background:var(--bg); padding:1px 4px; border-radius:4px; font-size:13px; }
  details.steps { margin-top:10px; font-size:12px; color:var(--muted); }
  .step { font-family:ui-monospace,monospace; margin-top:4px; word-break:break-all; }
  /* case view */
  .cv { margin-bottom:12px; }
  .cv h2 { font-size:14px; margin:0 0 8px; }
  .tiers { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; align-items:flex-start; }
  .tier { flex:1 1 180px; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px; }
  .tier ul { margin:4px 0 0; padding-left:18px; }
  .tablewrap { overflow-x:auto; border:1px solid var(--line); border-radius:8px; }
  table.cv-table { border-collapse:collapse; width:100%; min-width:680px; font-size:13px; }
  .cv-table th, .cv-table td { padding:6px 8px; text-align:left; vertical-align:top; border-bottom:1px solid var(--line); }
  .cv-table th { background:var(--bg); font-weight:600; white-space:nowrap; }
  tr.conflict > td:first-child { border-left:4px solid var(--warn); }
  tr.conflict { background:var(--warnbg); }
  tr.detail > td { background:var(--bg); padding:10px 12px; }
  .badge { display:inline-flex; gap:4px; align-items:center; border-radius:10px; padding:1px 8px; font-size:12px; font-weight:600; white-space:nowrap; border:1px solid currentColor; }
  .b-met, .b-supported { color:var(--ok); background:var(--okbg); }
  .b-not_met, .b-blocked { color:var(--bad); background:var(--badbg); }
  .b-pending, .b-cannot_determine { color:var(--warn); background:var(--warnbg); }
  .b-uncertain, .b-unconfirmed { color:var(--unk); background:var(--unkbg); }
  .conflict-tag { display:inline-block; margin-left:6px; font-size:11px; font-weight:700; color:var(--warn); border:1px solid var(--warn); border-radius:4px; padding:0 4px; }
  .exp { background:none; border:1px solid var(--line); border-radius:6px; padding:2px 8px; cursor:pointer; font-size:12px; }
  .evidence table { border-collapse:collapse; width:100%; margin:4px 0 8px; font-size:12px; }
  .evidence th, .evidence td { border:1px solid var(--line); padding:3px 6px; text-align:left; vertical-align:top; }
  .cc { border:1px solid var(--warn); border-radius:8px; padding:8px 10px; margin:8px 0; background:var(--card); }
  .cc h3 { font-size:13px; margin:0 0 4px; }
  .nores { font-weight:600; color:var(--warn); }
  .draft { border:1px dashed var(--line); border-radius:6px; padding:6px 8px; margin-top:6px; }
  .draft pre { white-space:pre-wrap; word-break:break-word; margin:6px 0; font:12px/1.4 ui-monospace,monospace; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; }
  .actions button, .actions a { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:4px 10px; cursor:pointer; text-decoration:none; font-size:12px; }
  .banner { margin-top:8px; padding:6px 10px; border-radius:6px; font-size:12px; background:var(--badbg); color:var(--bad); }
  .note { margin-top:6px; font-size:12px; color:var(--muted); }
  .chips { flex:0 0 auto; display:flex; gap:6px; overflow-x:auto; max-width:1000px; width:100%; margin:0 auto; padding:4px 16px; }
  .chips button { flex:0 0 auto; border:1px solid var(--line); background:var(--card); border-radius:14px; padding:4px 10px; cursor:pointer; font-size:13px; white-space:nowrap; }
  form { flex:0 0 auto; display:flex; gap:8px; padding:8px 16px; max-width:1000px; width:100%; margin:0 auto; }
  input { flex:1; min-width:0; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); }
  form button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:0 18px; cursor:pointer; }
  footer { flex:0 0 auto; text-align:center; font-size:12px; color:var(--muted); padding-bottom:6px; }
  @media (max-width:640px) { .msg { max-width:100%; } header h1 { font-size:14px; } #chat { padding:10px; } }
</style>
</head>
<body>
<header>
  <h1>GDTP onboarding case view</h1>
  <label>Viewing as <select id="role"></select></label>
  <button id="clear" type="button">Clear</button>
</header>
<div id="chatwrap"><div id="chat"></div><button id="jump" type="button" hidden>↓ Jump to latest</button></div>
<div class="chips" id="chips"></div>
<form id="f"><input id="q" placeholder="Ask about Julie Sour's onboarding..." autocomplete="off"><button>Send</button></form>
<footer>SYNTHETIC – DEMO ONLY</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
const SAMPLES = [
  "Can Julie Sour join the Garda Cyber Security Programme, and if not, what's missing?",
  "What is Julie's start date?",
  "What is Julia Sour's vetting status?",
  "Who else is in the vetting register and what did the reviewers say?",
  "Can MFA be completed after the start date?",
  "What is Julie's clearance reference?",
];
const chat = document.getElementById('chat'), q = document.getElementById('q'), roleSel = document.getElementById('role'),
      jump = document.getElementById('jump');
let history = [];

// ---------- safe DOM helpers: document-derived data is only ever set via textContent ----------
function el(tag, props = {}, kids = []) {
  const e = document.createElement(tag);
  if (props.cls) e.className = props.cls;
  if (props.text !== undefined) e.textContent = props.text;
  for (const [k, v] of Object.entries(props.attrs || {})) e.setAttribute(k, v);
  for (const k of [].concat(kids)) if (k) e.appendChild(k);
  return e;
}
function renderMd(text) {  // narrative only; sanitised
  if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(text, {gfm: true, breaks: true}));
  const d = document.createElement('div'); d.textContent = text; return d.innerHTML;
}

// ---------- scrolling ----------
const nearBottom = () => chat.scrollHeight - chat.scrollTop - chat.clientHeight < 80;
function toBottom() { chat.scrollTop = chat.scrollHeight; jump.hidden = true; }
chat.addEventListener('scroll', () => { jump.hidden = nearBottom(); });
jump.onclick = toBottom;
function add(text, cls) {
  const follow = nearBottom() || cls === 'user';
  const d = el('div', {cls: 'msg ' + cls, text}); chat.appendChild(d);
  follow ? toBottom() : (jump.hidden = false);
  return d;
}

// ---------- case view ----------
const ICON = {met: '✓', supported: '✓', not_met: '✗', blocked: '✗', pending: '⏳', cannot_determine: '?', uncertain: '?', unconfirmed: '!'};
function badge(kind, label) { return el('span', {cls: 'badge b-' + kind, text: (ICON[kind] || '•') + ' ' + label}); }
function mailto(d) {
  const enc = encodeURIComponent;
  return 'mailto:' + (d.to || '') + '?subject=' + enc(d.subject) + '&body=' + enc(d.body) + (d.cc ? '&cc=' + d.cc : '');
}
async function copyText(btn, text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const t = el('textarea', {text}); document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch (_) {} t.remove(); }
  const old = btn.textContent; btn.textContent = 'Copied'; setTimeout(() => btn.textContent = old, 1500);
}
function valuesTable(rows) {
  return el('table', {}, [
    el('tr', {}, ['Source', 'Authority', 'Date', 'Value'].map(h => el('th', {text: h}))),
    ...rows.map(s => el('tr', {}, [s.doc_id, s.authority, s.date, s.value].map(x => el('td', {text: x}))))]);
}
function conflictCard(c) {
  const card = el('div', {cls: 'cc'}, [el('h3', {text: '⚠ Conflict: ' + c.summary}), valuesTable(c.values)]);
  if (c.proposed_resolution) card.appendChild(el('div', {}, [
    el('strong', {text: 'Proposed resolution (a proposal, not applied): '}), document.createTextNode(c.proposed_resolution)]));
  if (!c.resolvable_by_agent) card.appendChild(el('div', {cls: 'nores', text: "The agent can't resolve this; needs a human decision."}));
  const k = c.contact;
  card.appendChild(el('div', {}, [el('strong', {text: 'Who to follow up with: '}),
    document.createTextNode(k.name + ' - ' + k.role + (k.email ? ' - ' + k.email : ''))]));
  const d = c.email_draft;
  const pre = el('pre', {text: d.body});
  const copy = el('button', {text: 'Copy', attrs: {type: 'button'}});
  copy.onclick = () => copyText(copy, `To: ${d.to}\n${d.cc ? 'Cc: ' + d.cc + '\n' : ''}Subject: ${d.subject}\n\n${d.body}`);
  const open = el('a', {text: 'Open in email client', attrs: {href: mailto(d), target: '_blank', rel: 'noopener'}});
  card.appendChild(el('div', {cls: 'draft'}, [
    el('div', {}, [el('strong', {text: 'Follow-up email draft '}), document.createTextNode('(never sent by this app; you send it)')]),
    el('div', {text: 'To: ' + (d.to || '(none: ask your supervisor)') + (d.cc ? '   Cc: ' + d.cc : '')}),
    el('div', {text: 'Subject: ' + d.subject}), pre, el('div', {cls: 'actions'}, [copy, open])]));
  return card;
}
function renderCaseView(cv) {
  const root = el('div', {cls: 'cv'}, [el('h2', {text: 'Case view: ' + cv.subject})]);
  root.appendChild(el('div', {cls: 'tiers'}, cv.tiers.map(t => el('div', {cls: 'tier'}, [
    el('div', {}, [el('strong', {text: t.name + ' '}), badge(t.outcome, t.outcome.replace('_', ' '))]),
    t.approver ? el('div', {cls: 'note', text: 'Approver: ' + t.approver}) : null,
    t.blockers.length ? el('ul', {}, t.blockers.map(b => el('li', {text: b}))) : null]))));
  const tbody = el('tbody');
  cv.requirements.forEach(r => {
    const hasC = r.conflicts.length > 0;
    const exp = el('button', {cls: 'exp', text: 'Details', attrs: {type: 'button', 'aria-expanded': 'false'}});
    const label = el('td', {}, [document.createTextNode(r.label)]);
    if (hasC) label.appendChild(el('span', {cls: 'conflict-tag', text: '⚠ Conflict' + (r.conflicts.length > 1 ? ' x' + r.conflicts.length : '')}));
    const tr = el('tr', {cls: 'row' + (hasC ? ' conflict' : '')}, [
      label, el('td', {}, [badge(r.badge, r.badge_label)]), el('td', {text: r.value || '(details not shown to your role)'}),
      el('td', {text: [...new Set(r.sources.map(s => s.doc_id))].join(', ') || '-'}),
      el('td', {text: r.confidence || '-'}), el('td', {}, [exp])]);
    const ev = el('div', {cls: 'evidence'});
    ev.appendChild(r.sources.length ? valuesTable(r.sources) : el('div', {cls: 'note', text: 'Evidence is not shown to your role (status only).'}));
    r.conflicts.forEach(c => ev.appendChild(conflictCard(c)));
    const detail = el('tr', {cls: 'detail'}, [el('td', {attrs: {colspan: '6'}}, [ev])]);
    detail.hidden = true;
    exp.onclick = () => { detail.hidden = !detail.hidden; exp.setAttribute('aria-expanded', String(!detail.hidden)); exp.textContent = detail.hidden ? 'Details' : 'Hide'; };
    tbody.append(tr, detail);
  });
  root.appendChild(el('div', {cls: 'tablewrap'}, [el('table', {cls: 'cv-table'}, [
    el('thead', {}, [el('tr', {}, ['Requirement', 'Status', 'Value', 'Source', 'Confidence', ''].map(h => el('th', {text: h})))]), tbody])]));
  cv.security_flags.forEach(f => root.appendChild(el('div', {cls: 'banner', text: '⚠ Security flag: ' + f})));
  cv.derived_documents.forEach(f => root.appendChild(el('div', {cls: 'note', text: 'Note: ' + f})));
  if (cv.withheld.count) root.appendChild(el('div', {cls: 'note', text: cv.withheld.message}));
  return root;
}

// ---------- chat flow ----------
async function send(text) {
  if (!text.trim()) return;
  add(text, 'user'); history.push({role: 'user', content: text}); q.value = '';
  const wait = add('Thinking…', 'bot');
  try {
    const r = await fetch('/api/chat', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({role: roleSel.value, messages: history})});
    const j = await r.json();
    if (j.error) { wait.textContent = j.error; wait.classList.add('err'); history.pop(); return; }
    const follow = nearBottom();
    history.push({role: 'assistant', content: j.answer});
    wait.textContent = '';
    if (j.case_view) { wait.classList.add('wide'); wait.appendChild(renderCaseView(j.case_view)); }
    wait.appendChild(el('div', {cls: 'md'})).innerHTML = renderMd(j.answer);
    if (j.steps && j.steps.length) {
      wait.appendChild(el('details', {cls: 'steps'}, [el('summary', {text: 'Agent steps (' + j.steps.length + ' tool calls)'}),
        ...j.steps.map(t => el('div', {cls: 'step', text: t.tool + '(' + JSON.stringify(t.args) + ') → ' + t.result}))]));
    }
    follow ? toBottom() : (jump.hidden = false);
  } catch (e) { wait.textContent = 'Request failed: ' + e; wait.classList.add('err'); history.pop(); }
}
document.getElementById('f').onsubmit = e => { e.preventDefault(); send(q.value); };
document.getElementById('clear').onclick = () => { history = []; chat.innerHTML = ''; jump.hidden = true; };
roleSel.onchange = () => { history = []; chat.innerHTML = ''; add('Role switched. Conversation reset.', 'bot'); };
SAMPLES.forEach(s => { const b = el('button', {text: s.length > 48 ? s.slice(0, 46) + '…' : s, attrs: {type: 'button', title: s}}); b.onclick = () => send(s); document.getElementById('chips').appendChild(b); });
fetch('/api/roles').then(r => r.json()).then(rs => rs.forEach(r => roleSel.appendChild(el('option', {text: r.label, attrs: {value: r.id}}))));
</script>
</body>
</html>
